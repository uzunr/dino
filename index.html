<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rex Run 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--panel:rgba(255,246,230,.94);--ink:#3b2a1e;--accent:#ff7a3d;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:rgba(34,25,32,.94);--ink:#f7e9d4;color-scheme:dark}}
:root[data-theme="dark"]{--panel:rgba(34,25,32,.94);--ink:#f7e9d4;color-scheme:dark}
html,body{margin:0;height:100%;overflow:hidden;background:#f6c48c;touch-action:none;user-select:none;-webkit-user-select:none;font-family:'Silkscreen',ui-monospace,Menlo,monospace}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;background:var(--panel);color:var(--ink);padding:6px 12px;border:3px solid var(--ink);font-size:18px;display:flex;gap:16px}
#hud.pulse{animation:pl .35s steps(2) 2}
@keyframes pl{50%{background:var(--accent)}}
@media (prefers-reduced-motion:reduce){#hud.pulse{animation:none}}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);box-sizing:border-box}
#card{background:var(--panel);color:var(--ink);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--accent);padding:20px 26px;max-width:min(92vw,430px);text-align:center;line-height:1.5}
#card h1{margin:0 0 6px;font-size:clamp(28px,7vw,44px)}
#card p{margin:6px 0;font-size:14px}
#go{display:inline-block;margin-top:10px;background:var(--accent);color:#2a160c;padding:8px 14px;font-weight:700;font-size:14px}
.hide{display:none!important}
</style>
</head>
<body>
<div id="hud"><span>Best <b id="hi">00000</b></span><span id="sc">00000</span></div>
<div id="ov"><div id="card">
  <h1 id="ttl">Rex Run 3D</h1>
  <p id="sub">Jump the cacti. Duck the pterosaurs.</p>
  <p id="how">Space or ↑ to jump (hold for height), ↓ to duck.<br>Touch: tap the top half to jump, hold the bottom half to duck.</p>
  <span id="go">Press Space or tap to start</span>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
document.body.appendChild(renderer.domElement);
var scene=new THREE.Scene(),SKY=0xf6c48c;
scene.background=new THREE.Color(SKY);
scene.fog=new THREE.Fog(SKY,30,125);
var cam=new THREE.PerspectiveCamera(55,1,.1,320);
scene.add(new THREE.HemisphereLight(0xfff1d6,0xb98a4e,.95));
var sunL=new THREE.DirectionalLight(0xffffff,.7);sunL.position.set(-5,10,6);scene.add(sunL);

var mats={};
function mat(c){return mats[c]||(mats[c]=new THREE.MeshLambertMaterial({color:c}));}
function box(w,h,l,c,x,y,z,p){var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,l),mat(c));m.position.set(x||0,y||0,z||0);(p||scene).add(m);return m;}
function rnd(a,b){return a+Math.random()*(b-a);}

/* world */
var ground=new THREE.Mesh(new THREE.PlaneGeometry(120,340),mat(0xe9bd72));
ground.rotation.x=-Math.PI/2;ground.position.z=-150;scene.add(ground);
box(3.4,.02,340,0xdcab5e,0,.01,-150);
var sunM=new THREE.Mesh(new THREE.SphereGeometry(9,24,16),new THREE.MeshBasicMaterial({color:0xfff1c1,fog:false}));
sunM.position.set(-34,24,-170);scene.add(sunM);
var mm=[0xd9966b,0xcf8a62,0xc97f5c];
for(var i=0;i<10;i++){
  var r=rnd(14,26),m=new THREE.Mesh(new THREE.ConeGeometry(r,rnd(14,28),4),new THREE.MeshLambertMaterial({color:mm[i%3],fog:false}));
  m.rotation.y=Math.PI/4;m.position.set(-120+i*27+rnd(-6,6),2,-175);scene.add(m);
}

/* dino */
var dino=new THREE.Group();scene.add(dino);
var T=0x2fa597,BL=0xf4d9a0,OR=0xff7a3d,DK=0x1d1d2b;
box(1,1,1.5,T,0,1.25,0,dino);
box(1.02,.45,1.1,BL,0,1.0,0,dino);
box(.95,.85,1,T,0,2.1,-.85,dino);
box(.75,.45,.55,T,0,1.95,-1.55,dino);
[-1,1].forEach(function(s){
  box(.12,.22,.22,0xffffff,s*.5,2.3,-1.0,dino);
  box(.06,.1,.1,DK,s*.55,2.27,-1.06,dino);
  box(.18,.18,.4,T,s*.58,1.35,-.65,dino);
});
box(.55,.55,.9,T,0,1.25,1.15,dino);
box(.35,.35,.8,T,0,1.12,1.85,dino);
for(var i=0;i<4;i++)box(.18,.3,.3,OR,0,1.9,-.5+i*.45,dino);
var legs=[-1,1].map(function(s){
  var p=new THREE.Group();p.position.set(s*.28,.8,0);dino.add(p);
  box(.38,.8,.5,T,0,-.4,0,p);box(.4,.15,.7,BL,0,-.74,-.1,p);return p;
});

/* obstacle prototypes */
function makeCactus(h){
  var g=new THREE.Group(),G=0x3f9a52,D=0x2f7d42,a=h*.5,b=h*.35;
  box(.6,h,.6,G,0,h/2,0,g);
  box(.5,.2,.2,D,-.4,a,0,g);box(.2,h*.32,.2,D,-.55,a+h*.16,0,g);
  box(.5,.2,.2,D,.4,b,0,g);box(.2,h*.28,.2,D,.55,b+h*.14,0,g);
  g.userData.h=h;return g;
}
var cacti=[makeCactus(1.1),makeCactus(1.5),makeCactus(1.9)];
var flyerP=new THREE.Group();
(function(){
  var P=0x7a4fd6;
  box(.6,.5,1.1,P,0,.3,0,flyerP);box(.4,.4,.6,P,0,.42,.8,flyerP);box(.15,.12,.5,OR,0,.36,1.2,flyerP);
  [-1,1].forEach(function(s){
    var w=new THREE.Group();w.name=s<0?'wl':'wr';w.position.set(s*.3,.45,0);flyerP.add(w);
    box(1.3,.08,.7,0xa987ff,s*.65,0,0,w);
  });
})();

/* scenery */
var scen=[],SIDE=function(){return (Math.random()<.5?-1:1)*rnd(5,18);};
for(var i=0;i<16;i++){
  var s=rnd(.5,1.6),m=box(s,s*rnd(.5,.9),s*rnd(.8,1.4),i%2?0xb98a5a:0xa87850,SIDE(),s*.3,rnd(-100,10));
  m.rotation.y=rnd(0,3);m.userData.rand=true;scen.push(m);
}
for(var i=0;i<12;i++){
  var c=cacti[i%3].clone();c.scale.setScalar(rnd(.7,1.3));c.position.set(SIDE(),0,rnd(-100,10));
  c.userData.rand=true;scene.add(c);scen.push(c);
}
for(var i=0;i<14;i++)[-1,1].forEach(function(s){
  var d=box(.14,.02,1.2,0xfff0cf,s*1.7,.03,-i*8+6);scen.push(d);
});

/* state */
var state='ready',score=0,speed=14,t=0,y=0,vy=0,duck=false,held=false,since=0,gap=40,hi=0,overAt=0,shake=0,lastM=0;
var obs=[];
try{hi=+localStorage.getItem('rexrun-hi')||0;}catch(e){}
var $=function(i){return document.getElementById(i);};
var hud=$('hud'),scEl=$('sc'),hiEl=$('hi'),ov=$('ov');
var pad=function(n){return String(Math.floor(n)).padStart(5,'0');};
hiEl.textContent=pad(hi);

function spawn(){
  var fly=score>250&&Math.random()<.3;
  if(fly){
    var h=Math.random()<.5?.1:1.15,m=flyerP.clone();
    m.position.set(0,h,-95);scene.add(m);
    obs.push({m:m,hd:.7,y0:h+.05,y1:h+.55,fly:true});
  }else{
    var n=1+Math.floor(Math.random()*(score>400?3:2)),g=new THREE.Group(),hm=0;
    for(var i=0;i<n;i++){
      var p=cacti[Math.random()*3|0],c=p.clone();
      c.position.z=(i-(n-1)/2)*.95;g.add(c);hm=Math.max(hm,p.userData.h);
    }
    g.position.z=-95;scene.add(g);
    obs.push({m:g,hd:(n-1)*.475+.32,y0:0,y1:hm-.15,fly:false});
  }
}
function start(){
  obs.forEach(function(o){scene.remove(o.m);});obs=[];
  score=0;speed=14;y=0;vy=0;since=0;gap=45;lastM=0;shake=0;
  dino.rotation.z=0;scEl.textContent=pad(0);
  state='run';ov.classList.add('hide');
}
function die(){
  state='over';overAt=performance.now();shake=.4;dino.rotation.z=.35;
  if(score>hi){hi=Math.floor(score);try{localStorage.setItem('rexrun-hi',hi);}catch(e){}hiEl.textContent=pad(hi);}
  $('ttl').textContent='Game over';
  $('sub').textContent='Score '+pad(score)+', best '+pad(hi);
  $('how').classList.add('hide');
  $('go').textContent='Press Space or tap to run again';
  ov.classList.remove('hide');
}
function setDuck(v){duck=v;}
function jumpPress(){
  if(state!=='run'){
    if(state==='ready'||performance.now()-overAt>450)start();
    return;
  }
  held=true;
  if(y===0&&vy===0)vy=17;
}
function release(){held=false;setDuck(false);}

addEventListener('keydown',function(e){
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();if(!e.repeat)jumpPress();held=true;}
  else if(e.code==='ArrowDown'||e.code==='KeyS'){e.preventDefault();setDuck(true);}
});
addEventListener('keyup',function(e){
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')held=false;
  else if(e.code==='ArrowDown'||e.code==='KeyS')setDuck(false);
});
addEventListener('pointerdown',function(e){
  e.preventDefault();
  if(e.clientY>innerHeight/2&&state==='run')setDuck(true);else jumpPress();
});
addEventListener('pointerup',release);
addEventListener('pointercancel',release);

function resize(){
  var w=innerWidth,h=innerHeight;renderer.setSize(w,h);
  cam.aspect=w/h;cam.fov=w/h<1?78:55;cam.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();

function step(dt){
  t+=dt;
  var scroll=state==='run'?speed:(state==='ready'?6:0);
  if(state==='run'){
    speed=Math.min(36,14+score*.008);
    score+=speed*dt;
    if(y>0||vy>0){
      var g=duck?190:(held&&vy>0?48:95);
      vy-=g*dt;y+=vy*dt;
      if(y<=0){y=0;vy=0;}
    }
    since+=speed*dt;
    if(since>gap){spawn();since=0;gap=speed*.85+10+Math.random()*speed*.8;}
    var dh=duck&&y===0?1.0:1.6,d0=y+.12,d1=y+dh-.12;
    for(var i=obs.length-1;i>=0;i--){
      var o=obs[i];
      o.m.position.z+=(speed+(o.fly?5:0))*dt;
      if(o.fly){var f=Math.sin(t*16)*.6;o.m.getObjectByName('wl').rotation.z=f;o.m.getObjectByName('wr').rotation.z=-f;}
      if(Math.abs(o.m.position.z)<o.hd+.38&&d1>o.y0&&d0<o.y1)die();
      if(o.m.position.z>10){scene.remove(o.m);obs.splice(i,1);}
    }
    var s=Math.floor(score);
    scEl.textContent=pad(s);
    var mk=Math.floor(s/100);
    if(mk>lastM){lastM=mk;hud.classList.remove('pulse');void hud.offsetWidth;hud.classList.add('pulse');}
  }
  for(var i=0;i<scen.length;i++){
    var m=scen[i];m.position.z+=scroll*dt;
    if(m.position.z>12){m.position.z-=112;if(m.userData.rand)m.position.x=SIDE();}
  }
  var onG=y===0,run=t*(state==='run'?speed*.55:10);
  if(state==='over'){/* frozen */}
  else if(onG){legs[0].rotation.x=Math.sin(run)*.8;legs[1].rotation.x=-Math.sin(run)*.8;}
  else{legs[0].rotation.x=.5;legs[1].rotation.x=-.5;}
  dino.position.y=y+(onG&&state!=='over'?Math.abs(Math.sin(run))*.06:0);
  var ducked=duck&&state==='run';
  dino.scale.set(1,ducked?.62:1,ducked?1.12:1);
  var cx=3.4,cy=3.6;
  if(shake>0){shake-=dt;cx+=rnd(-1,1)*shake;cy+=rnd(-1,1)*shake;}
  cam.position.set(cx,cy,7.2);cam.lookAt(0,1.3,-9);
}
var last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(.05,(now-last)/1000);last=now;
  step(dt);renderer.render(scene,cam);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
